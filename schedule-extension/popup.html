<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: sans-serif; width: 280px; padding: 16px; }
    label { display: block; font-size: 12px; color: #6b7280; margin-bottom: 4px; }
    input[type="password"] {
      width: 100%; padding: 8px; border: 1px solid #d1d5db;
      border-radius: 6px; font-size: 13px; box-sizing: border-box;
      margin-bottom: 10px;
    }
    button {
      width: 100%; padding: 10px; background: #1a1a1a; color: white;
      border: none; border-radius: 6px; font-size: 14px; cursor: pointer;
    }
    button:disabled { background: #9ca3af; cursor: not-allowed; }
    #status { margin-top: 12px; font-size: 13px; color: #374151; min-height: 20px; }
    .error   { color: #dc2626; }
    .success { color: #059669; }
  </style>
</head>
<body>
  <h3 style="margin:0 0 12px">Schedule Sync</h3>
  <label for="password">Admin password</label>
  <input type="password" id="password" placeholder="Same as journal admin">
  <button id="syncBtn">Sync to Supabase</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
