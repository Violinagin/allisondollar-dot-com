<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Journal Admin</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    .custom-image-widget {
      border: 1px dashed #ccc;
      padding: 1rem;
      border-radius: 4px;
    }
    .image-preview {
      margin-bottom: 1rem;
    }
    .loading {
      color: #666;
      font-style: italic;
      margin: 1rem 0;
    }
  </style>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script src="/journal/admin/upload-widget.js"></script>
  <script>
    // Register custom widget
    const CustomImageWidget = createClass({
      handleChange: function(e) {
        const file = e.target.files[0];
        const formData = new FormData();
        formData.append('file', file);
        
        this.props.onChange('_loading');
        
        fetch('/.netlify/functions/upload-image', {
          method: 'POST',
          body: formData
        })
        .then(res => res.json())
        .then(data => {
          if (data.url) {
            this.props.onChange(data.url);
          } else {
            alert('Upload failed: ' + (data.error || 'Unknown error'));
            this.props.onChange('');
          }
        })
        .catch(err => {
          alert('Upload failed: ' + err.message);
          this.props.onChange('');
        });
      },
      
      render: function() {
        const { value } = this.props;
        
        return h('div', { className: 'custom-image-widget' }, [
          value && value !== '_loading' && h('div', { className: 'image-preview' }, [
            h('img', { src: value, style: { maxWidth: '100%', maxHeight: '200px' } })
          ]),
          value === '_loading' && h('div', { className: 'loading' }, 'Uploading...'),
          h('input', {
            type: 'file',
            onChange: this.handleChange,
            accept: 'image/*',
            style: { marginTop: '10px' }
          }),
          value && value !== '_loading' && h('button', {
            onClick: () => this.props.onChange(''),
            style: { marginLeft: '10px' }
          }, 'Remove')
        ]);
      }
    });

    CMS.registerWidget('customImage', CustomImageWidget);

    // Initialize CMS with config
    CMS.init({
      config: {
        backend: {
          name: 'git-gateway',
          branch: 'main'
        },
        media_folder: 'src/assets/images/journal',
        public_folder: '/assets/images/journal',
        collections: [
          {
            name: 'journal',
            label: 'Journal Entries',
            folder: 'src/journal-entries',
            create: true,
            slug: '{{slug}}',
            fields: [
              { label: 'Title', name: 'title', widget: 'string' },
              { label: 'Date', name: 'date', widget: 'datetime' },
              { label: 'Body', name: 'body', widget: 'markdown' },
              { label: 'Tags', name: 'tags', widget: 'list', required: false },
              { 
                label: 'Cover Image', 
                name: 'cover_image', 
                widget: 'customImage',
                required: false 
              }
            ]
          }
        ]
      }
    });
  </script>
</body>
</html>
