backend:
  name: git-gateway
  branch: main

# This tells Decap to use your custom upload function
media_folder: ""  # We're handling this via custom function
public_folder: ""

collections:
  - name: "journal"
    label: "Journal Entries"
    folder: "src/journal-entries"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Body", name: "body", widget: "markdown" }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - label: "Cover Image"
        name: "cover_image"
        widget: "image"
        required: false
        # This tells Decap to use your custom endpoint
        media_library:
          name: "uploadcare"  # This is a trick - we'll override it
          config:
            publicKey: "fake"
        # We'll handle the actual upload via custom widget