[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[dev]
  functions = "netlify/functions"
  publish = "dist"

[functions]
  node_bundler = "zisi"

# Rewrite /journal/{slug}/ to the entry shell page.
# Netlify serves actual static files first, so /journal/ (index) is unaffected.
[[redirects]]
  from = "/journal/:slug/"
  to = "/journal/entry/"
  status = 200